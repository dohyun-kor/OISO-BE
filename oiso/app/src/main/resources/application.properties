spring.application.name=oiso
spring.profiles.default=prod

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

tour-data.api.base-url=${TOUR_API_BASE_URL:http://apis.data.go.kr}
tour-data.api.operation-path=${TOUR_API_OPERATION_PATH:/B551011/KorService2/areaBasedList2}
tour-data.api.festival-operation-path=${TOUR_API_FESTIVAL_OPERATION_PATH:/B551011/KorService2/searchFestival2}
tour-data.api.detail-common-operation-path=${TOUR_API_DETAIL_COMMON_OPERATION_PATH:/B551011/KorService2/detailCommon2}
tour-data.api.detail-info-operation-path=${TOUR_API_DETAIL_INFO_OPERATION_PATH:/B551011/KorService2/detailInfo2}
tour-data.api.page-size=${TOUR_API_PAGE_SIZE:1000}
tour-data.api.mobile-os=${TOUR_API_MOBILE_OS:ETC}
tour-data.api.mobile-app=${TOUR_API_MOBILE_APP:AppTest}
tour-data.api.arrange=${TOUR_API_ARRANGE:C}
tour-data.api.l-dong-regn-cd=${TOUR_API_L_DONG_REGN_CD:47}
tour-data.api.l-dong-signgu-cd=${TOUR_API_L_DONG_SIGNGU_CD:130}
tour-data.api.content-type-ids=${TOUR_API_CONTENT_TYPE_IDS:}
tour-data.schedule.tour-spots-cron=${TOUR_DATA_TOUR_SPOTS_CRON:0 0 3 * * *}
tour-data.schedule.festivals-cron=${TOUR_DATA_FESTIVALS_CRON:0 10 3 * * *}
tour-data.schedule.accommodations-cron=${TOUR_DATA_ACCOMMODATIONS_CRON:0 0 5 * * *}
management.endpoints.web.exposure.include=health

# OAuth provider endpoints and protocol settings are shared by all profiles.
spring.security.oauth2.client.registration.kakao.client-authentication-method=${KAKAO_AUTH_METHOD:client_secret_post}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=${KAKAO_GRANT_TYPE:authorization_code}
spring.security.oauth2.client.registration.kakao.scope=${KAKAO_SCOPE:profile_nickname,profile_image}
spring.security.oauth2.client.registration.kakao.client-name=${KAKAO_CLIENT_NAME:Kakao}
spring.security.oauth2.client.provider.kakao.authorization-uri=${KAKAO_AUTH_URI:https://kauth.kakao.com/oauth/authorize}
spring.security.oauth2.client.provider.kakao.token-uri=${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
spring.security.oauth2.client.provider.kakao.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
spring.security.oauth2.client.provider.kakao.user-name-attribute=${KAKAO_USER_NAME_ATTR:id}

# Google implementation is deferred, but registration remains available.
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:profile,email}
