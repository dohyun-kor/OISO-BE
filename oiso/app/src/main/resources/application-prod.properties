spring.datasource.url=${PROD_DATASOURCE_URL}
spring.datasource.username=${PROD_DATASOURCE_USERNAME}
spring.datasource.password=${PROD_DATASOURCE_PASSWORD}
spring.sql.init.mode=always

tour-data.api.service-key=${PROD_TOUR_API_SERVICE_KEY:${TOUR_API_SERVICE_KEY}}

spring.security.oauth2.client.registration.kakao.client-id=${PROD_KAKAO_CLIENT_ID:${KAKAO_CLIENT_ID}}
spring.security.oauth2.client.registration.kakao.client-secret=${PROD_KAKAO_CLIENT_SECRET:${KAKAO_CLIENT_SECRET}}
spring.security.oauth2.client.registration.kakao.redirect-uri=${PROD_KAKAO_REDIRECT_URI:${KAKAO_REDIRECT_URI:https://oiso.duckdns.org/login/oauth2/code/kakao}}
spring.security.oauth2.client.registration.google.client-id=${PROD_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:not-configured}}
spring.security.oauth2.client.registration.google.client-secret=${PROD_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:not-configured}}
spring.security.oauth2.client.registration.google.redirect-uri=${PROD_GOOGLE_REDIRECT_URI:${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}}

jwt.secret-key=${PROD_JWT_SECRET_KEY:${JWT_SECRET_KEY}}
jwt.access-token-validity=${PROD_JWT_ACCESS_TOKEN_VALIDITY:${JWT_ACCESS_TOKEN_VALIDITY:900000}}
jwt.refresh-token-validity=${PROD_JWT_REFRESH_TOKEN_VALIDITY:${JWT_REFRESH_TOKEN_VALIDITY:604800000}}

app.oauth2.success-redirect-uri=${PROD_OAUTH2_REDIRECT_URI:http://localhost:5173}
app.oauth2.allowed-redirect-uris=${PROD_OAUTH2_ALLOWED_REDIRECT_URIS}
app.cors.allowed-origin=${PROD_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.cookie.secure=${PROD_COOKIE_SECURE:${COOKIE_SECURE:true}}
app.cookie.same-site=${PROD_COOKIE_SAME_SITE:${COOKIE_SAME_SITE:None}}
app.cookie.access-token-max-age=${PROD_JWT_ACCESS_TOKEN_VALIDITY_SEC:${JWT_ACCESS_TOKEN_VALIDITY_SEC:900}}
app.cookie.refresh-token-max-age=${PROD_JWT_REFRESH_TOKEN_VALIDITY_SEC:${JWT_REFRESH_TOKEN_VALIDITY_SEC:604800}}

# Respect X-Forwarded-Proto/Host from the production reverse proxy.
server.forward-headers-strategy=framework
