spring.datasource.url=${LOCAL_DATASOURCE_URL:jdbc:postgresql://localhost:5432/OISO}
spring.datasource.username=${LOCAL_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${LOCAL_DATASOURCE_PASSWORD:ssafy}
spring.sql.init.mode=always

tour-data.api.service-key=${LOCAL_TOUR_API_SERVICE_KEY:${TOUR_API_SERVICE_KEY:}}

spring.security.oauth2.client.registration.kakao.client-id=${LOCAL_KAKAO_CLIENT_ID:${KAKAO_CLIENT_ID}}
spring.security.oauth2.client.registration.kakao.client-secret=${LOCAL_KAKAO_CLIENT_SECRET:${KAKAO_CLIENT_SECRET}}
spring.security.oauth2.client.registration.kakao.redirect-uri=${LOCAL_KAKAO_REDIRECT_URI:${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}}
spring.security.oauth2.client.registration.google.client-id=${LOCAL_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:not-configured}}
spring.security.oauth2.client.registration.google.client-secret=${LOCAL_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:not-configured}}
spring.security.oauth2.client.registration.google.redirect-uri=${LOCAL_GOOGLE_REDIRECT_URI:${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}}

jwt.secret-key=${LOCAL_JWT_SECRET_KEY:${JWT_SECRET_KEY}}
jwt.access-token-validity=${LOCAL_JWT_ACCESS_TOKEN_VALIDITY:${JWT_ACCESS_TOKEN_VALIDITY:900000}}
jwt.refresh-token-validity=${LOCAL_JWT_REFRESH_TOKEN_VALIDITY:${JWT_REFRESH_TOKEN_VALIDITY:604800000}}

app.oauth2.success-redirect-uri=${LOCAL_OAUTH2_REDIRECT_URI:${OAUTH2_REDIRECT_URI:http://localhost:3000/}}
app.oauth2.allowed-redirect-uris=${LOCAL_OAUTH2_ALLOWED_REDIRECT_URIS:http://localhost:5173/}
app.cors.allowed-origin=${LOCAL_CORS_ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGIN:http://localhost:3000}}
app.cookie.secure=${LOCAL_COOKIE_SECURE:${COOKIE_SECURE:false}}
app.cookie.same-site=${LOCAL_COOKIE_SAME_SITE:${COOKIE_SAME_SITE:Lax}}
app.cookie.access-token-max-age=${LOCAL_JWT_ACCESS_TOKEN_VALIDITY_SEC:${JWT_ACCESS_TOKEN_VALIDITY_SEC:900}}
app.cookie.refresh-token-max-age=${LOCAL_JWT_REFRESH_TOKEN_VALIDITY_SEC:${JWT_REFRESH_TOKEN_VALIDITY_SEC:604800}}
